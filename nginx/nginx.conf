events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name localhost *.localhost *.scholarlogic.edu;

        # Redirect HTTP to HTTPS in production environments if SSL certificates are present
        # listen 443 ssl;
        # ssl_certificate /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Frontend Static Asset Delivery & SPA Routing
        location / {
            proxy_pass http://scholarlogic-app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE Realtime Notification Stream (Unbuffered Proxying)
        location /api/notifications/stream {
            proxy_pass http://scholarlogic-app:5000/api/notifications/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Disable buffering & caching for SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://scholarlogic-app:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
