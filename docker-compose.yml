version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: scholarlogic_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - scholarlogic-app
    restart: always

  scholarlogic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarlogic_production
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongo:27017/scholarlogic}
      - JWT_SECRET=${JWT_SECRET:-production_secret_key_scholarlogic_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-production_refresh_secret_key_scholarlogic_2026}
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:5000
    restart: always
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: scholarlogic_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
